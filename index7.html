  <style>
    body { 
      font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      scroll-behavior: smooth;
    }
    
    /* Animation Keyframes */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.5); }
      50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.8), 0 0 30px rgba(239, 68, 68, 0.6); }
    }
    
    /* Animation Classes */
    .animate-pulse { animation: pulse 2s infinite; }
    
    /* Gradient Text */
    .gradient-text {
      background: linear-gradient(to right, #e91e63, #9c27b0, #3b82f6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
    }
    
    /* Card Hover Effects */
    .anime-card {
      position: relative;
      overflow: hidden;
      border-radius: 1.5rem;
      transition: transform 0.5s ease, box-shadow 0.5s ease;
    }
    
    .anime-card:hover {
      transform: scale(1.05) translateY(-5px);
      box-shadow: 0 25px 40px rgba(0,0,0,0.35);
    }
    
    .anime-card::after {
      content: '';
      position: absolute;
      top: -75%;
      left: -75%;
      width: 200%;
      height: 200%;
      background: linear-gradient(120deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 60%);
      transform: rotate(25deg) translateX(-100%);
      transition: transform 0.7s ease;
    }
    
    .anime-card:hover::after {
      transform: rotate(25deg) translateX(100%);
    }
    
    .anime-card img {
      transition: transform 0.5s ease;
    }
    
    .anime-card img:hover {
      transform: scale(1.1);
    }
    
    /* Custom Button Styles */
    .btn {
      transition: all 0.3s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(156, 39, 176, 0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(156, 39, 176, 0.4);
    }
    
    .btn-outline {
      border: 2px solid #e91e63;
      color: #e91e63;
      background: transparent;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 600;
    }
    
    .btn-outline:hover {
      background: #e91e63;
      color: white;
    }
    
    /* Header Styles */
    .header-bg {
      background: linear-gradient(to right, rgba(0, 0, 0, 0.9), rgba(79, 70, 229, 0.9));
      backdrop-filter: blur(10px);
    }
    
    /* Logo Box Shadow */
    .logo-shadow {
      box-shadow: 0 0 10px rgba(156, 39, 176, 0.5);
    }
    
    /* Hero Section with Full Image Background - Enhanced Visibility */
    .hero-bg {
      background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://static.crunchyroll.com/cr-acquisition/assets/img/start/hero/background-desktop.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    
    /* Dark mode styles */
    body.dark {
      background: linear-gradient(135deg, #111827, #1e1b4b);
      color: #f3f4f6;
    }
    
    body.dark .anime-card {
      background: linear-gradient(135deg, #1e293b, #312e81);
    }
    
    body.dark .header-bg {
      background: linear-gradient(to right, rgba(30, 41, 59, 0.95), rgba(49, 46, 129, 0.95));
    }
    
    body.dark .logo-shadow {
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }
    
    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .text-xl { font-size: 1rem; }
      .text-2xl { font-size: 1.25rem; }
      .text-3xl { font-size: 1.5rem; }
      .text-4xl { font-size: 1.75rem; }
    }
    
    /* Image placeholder */
    .image-placeholder {
      background: linear-gradient(45deg, #f0f0f0, #e0e0e0);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
    }
    
    body.dark .image-placeholder {
      background: linear-gradient(45deg, #374151, #4b5563);
      color: #9ca3af;
    }

    /* Table Styles */
    .comparison-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 1rem;
    }

    .comparison-table th {
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      color: white;
      padding: 1rem;
      text-align: left;
      font-weight: 600;
    }

    .comparison-table td {
      padding: 1rem;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    body.dark .comparison-table td {
      background: #1e293b;
      border-bottom: 1px solid #4b5563;
    }

    .comparison-table tr:hover td {
      background: #f3f4f6;
    }

    body.dark .comparison-table tr:hover td {
      background: #312e81;
    }
  </style>
</head>

  <script type="text/babel">

    function App() {
      const [darkMode, setDarkMode] = useState(localStorage.getItem('darkMode') === 'true');
      const [menuOpen, setMenuOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [filter, setFilter] = useState('all');
      const [sortBy, setSortBy] = useState('name');
      const [favorites, setFavorites] = useState(JSON.parse(localStorage.getItem('favorites')) || []);
      const [showScroll, setShowScroll] = useState(false);
      const [viewType, setViewType] = useState('grid');
      
      const heroRef = useRef(null);
      const streamingRef = useRef(null);
      const aboutRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('darkMode', darkMode);
        if (darkMode) document.body.classList.add('dark');
        else document.body.classList.remove('dark');
      }, [darkMode]);

      useEffect(() => {
        const handleScroll = () => {
          setShowScroll(window.scrollY > 300);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const scrollToSection = (ref) => {
        ref.current?.scrollIntoView({ behavior: 'smooth' });
        setMenuOpen(false);
      };

      const toggleFavorite = (siteName) => {
        const newFavorites = favorites.includes(siteName) 
          ? favorites.filter(f => f !== siteName) 
          : [...favorites, siteName];
        
        setFavorites(newFavorites);
        localStorage.setItem('favorites', JSON.stringify(newFavorites));
      };

      const filteredSites = useMemo(() => {
        let sites = streamingSites.filter(site => {
          const matchesSearch = site.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                site.description.toLowerCase().includes(searchTerm.toLowerCase());
          
          const matchesFilter = filter === 'all' ||
            (filter === 'subbed' && site.subbed) ||
            (filter === 'dubbed' && site.dubbed) ||
            (filter === 'favorites' && favorites.includes(site.name)) ||
            (filter === 'popular' && site.category === 'popular') ||
            (filter === 'reliable' && site.category === 'reliable') ||
            (filter === 'extensive' && site.category === 'extensive') ||
            (filter === 'fast' && site.category === 'fast') ||
            (filter === 'premium' && site.category === 'premium') ||
            (filter === 'legal' && site.category === 'legal');
          
          return matchesSearch && matchesFilter;
        });

        if (sortBy === 'name') {
          sites.sort((a, b) => a.name.localeCompare(b.name));
        } else if (sortBy === 'rating') {
          sites.sort((a, b) => b.rating - a.rating);
        }

        return sites;
      }, [searchTerm, filter, favorites, sortBy]);

        return (
          <div className="flex items-center gap-1">
            {[...Array(5)].map((_, i) => (
              <i key={i} className={`fas ${i < Math.floor(rating) ? 'fa-star text-yellow-400' : 'fa-star text-gray-300'} text-sm`}></i>
            ))}
            <span className="ml-1 text-sm text-gray-500 dark:text-gray-400">({rating})</span>
          </div>
        );
      };

      const CategoryBadge = ({ category }) => {
        const colors = {
          popular: 'bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200',
          reliable: 'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200',
          extensive: 'bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200',
          fast: 'bg-purple-100 text-purple-800 dark:bg-purple-900 dark:text-purple-200',
          premium: 'bg-indigo-100 text-indigo-800 dark:bg-indigo-900 dark:text-indigo-200',
          legal: 'bg-teal-100 text-teal-800 dark:bg-teal-900 dark:text-teal-200'
        };
        
        return (
          <span className={`text-xs px-2 py-1 rounded-full ${colors[category]}`}>
            {category.charAt(0).toUpperCase() + category.slice(1)}
          </span>
        );
      };

      const Header = () => (
        <header className="header-bg text-white py-4 px-6 sticky top-0 z-50 shadow-lg backdrop-blur-sm bg-opacity-95">
          <div className="max-w-7xl mx-auto flex justify-between items-center">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-full bg-gradient-to-r from-red-500 to-purple-500 flex items-center justify-center logo-shadow">
                <i className="fas fa-play text-white"></i>
              </div>
              <h1 className="text-2xl md:text-3xl font-bold tracking-wide">Anime Hub</h1>
            </div>
            
            <nav className="flex items-center gap-4">
              <ul className={`md:flex gap-6 ${menuOpen ? 'flex flex-col absolute top-16 left-0 right-0 bg-gradient-to-r from-gray-800 to-gray-900 p-4 shadow-lg rounded-lg mx-4 backdrop-blur-md' : 'hidden md:flex'}`}>
                <li><a href="#home" className="hover:text-yellow-300 transition-colors font-medium" onClick={() => scrollToSection(heroRef)}>Home</a></li>
                <li><a href="#streaming" className="hover:text-yellow-300 transition-colors font-medium" onClick={() => scrollToSection(streamingRef)}>Streaming Sites</a></li>
                <li><a href="#about" className="hover:text-yellow-300 transition-colors font-medium" onClick={() => scrollToSection(aboutRef)}>About</a></li>
              </ul>
              
              <div className="flex items-center gap-3">
                <button
                  className="bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 text-white px-4 py-2 rounded-full transition-all transform hover:scale-105 hidden md:block"
                  onClick={() => setDarkMode(!darkMode)}
                  aria-pressed={darkMode}
                >
                  {darkMode ? 'Light Mode' : 'Dark Mode'}
                </button>
                
                <button
                  className="bg-gradient-to-r from-blue-500 to-purple-500 hover:from-blue-600 hover:to-purple-600 text-white p-3 rounded-full md:hidden"
                  onClick={() => setMenuOpen(!menuOpen)}
                  aria-label="Toggle navigation menu"
                >
                  <i className={`fas ${menuOpen ? 'fa-times' : 'fa-bars'}`}></i>
                </button>
              </div>

          </div>
        </header>
      );

      const Hero = () => (
        <section id="home" ref={heroRef} className="hero-bg relative text-center py-32 px-4">

              </div>
            </div>
            <h2 className="text-4xl md:text-5xl lg:text-6xl font-bold mb-4 text-white drop-shadow-lg">

            </h2>

            </p>
            
            <div className="flex flex-col sm:flex-row gap-4 justify-center items-center mb-8">

                  aria-label="Search for anime streaming sites"
                />
                <i className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 fa-solid fa-search"></i>
              </div>

              <div className="flex flex-col md:flex-row gap-4 w-full md:w-auto">

                  className={`p-4 rounded-full ${
                    darkMode ? 'bg-gray-800 border-purple-500 text-white' : 'bg-white border-red-500'

                  onChange={(e) => setFilter(e.target.value)}
                  aria-label="Filter streaming sites by type"
                >
                  <option value="all">All Sites</option>
                  <option value="subbed">Subbed Only</option>
                  <option value="dubbed">Dubbed Only</option>
                  <option value="favorites">Favorites</option>
                  <option value="popular">Popular</option>
                  <option value="reliable">Reliable</option>
                  <option value="extensive">Extensive Library</option>
                  <option value="fast">Fast Streaming</option>
                  <option value="premium">Minimal Ads</option>
                  <option value="legal">Legal Platform</option>
                </select>

                <select
                  className={`p-4 rounded-full ${
                    darkMode ? 'bg-gray-800 border-purple-500 text-white' : 'bg-white border-red-500'

                  value={sortBy}
                  onChange={(e) => setSortBy(e.target.value)}

                <div className="flex gap-2">

                    onClick={() => setViewType('list')}
                    aria-label="List view"
                  >
                    <i className="fas fa-list"></i>
                  </button>
                  <button
                    className={`p-4 rounded-full transition-all ${viewType === 'table' ? 'bg-purple-500 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}`}

                    aria-label="Table view"
                  >
                    <i className="fas fa-table"></i>
                  </button>
                </div>
              </div>
            </div>

            <div className="text-center mb-8">
              <p className="text-gray-500 dark:text-gray-400">
                Showing {filteredSites.length} of {streamingSites.length} platforms
              </p>
            </div>

            {viewType === 'table' ? (
              <div className="overflow-x-auto">
                <table className="comparison-table min-w-full">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Description</th>
                      <th>Subbed</th>
                      <th>Dubbed</th>
                      <th>Rating</th>
                      <th>Category</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredSites.map((site) => (
                      <tr key={site.name}>
                        <td className="font-semibold">{site.name}</td>
                        <td>{site.description}</td>
                        <td>{site.subbed ? '✓' : '✗'}</td>
                        <td>{site.dubbed ? '✓' : '✗'}</td>
                        <td><StarRating rating={site.rating} /></td>
                        <td><CategoryBadge category={site.category} /></td>
                        <td>
                          <a href={site.url} target="_blank" rel="noopener noreferrer" className="text-blue-500 hover:underline">Visit</a>
                          {' | '}
                          <button onClick={() => toggleFavorite(site.name)} className="text-yellow-500 hover:underline">
                            {favorites.includes(site.name) ? 'Unfavorite' : 'Favorite'}
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            ) : (
              <div className={viewType === 'grid' ? 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6' : 'space-y-6'}>
                {filteredSites.map((site, index) => (
                  <div 
                    key={site.name} 
                    className={`anime-card p-6 rounded-2xl shadow-xl transition-all duration-300 ${
                      darkMode ? 'bg-gradient-to-br from-gray-800 to-purple-900' : 'bg-white'
                    } ${viewType === 'list' ? 'flex flex-col md:flex-row items-center gap-6' : ''}`}
                  >
                    <div className={`relative overflow-hidden rounded-lg mb-4 ${viewType === 'list' ? 'w-full md:w-1/3' : 'w-full'}`}>
                      <div className="w-full h-40 image-placeholder">
                        <img
                          src={site.image}
                          alt={`Anime preview for ${site.name}`}
                          className="w-full h-40 object-cover"
                          loading="lazy"
                          onError={(e) => { 
                            e.target.onerror = null; 
                            e.target.src = 'https://via.placeholder.com/400x225?text=Anime+Preview'; 
                          }}
                        />
                      </div>
                      <div className="absolute top-2 right-2 flex gap-2">
                        <button
                          onClick={() => toggleFavorite(site.name)}
                          className={`text-2xl transition-all ${
                            favorites.includes(site.name) ? 'text-yellow-400' : 'text-gray-400 hover:text-yellow-400'
                          }`}
                          aria-label={`Add to favorites: ${site.name}`}
                        >
                          <i className={favorites.includes(site.name) ? 'fas fa-star' : 'far fa-star'}></i>
                        </button>
                        <CategoryBadge category={site.category} />
                      </div>
                    </div>
                    
                    <div className={viewType === 'list' ? 'w-full md:w-2/3' : 'w-full'}>
                      <div className="flex justify-between items-start mb-2">
                        <h3 className="text-2xl font-semibold text-red-500">{site.name}</h3>
                      </div>
                      
                      <StarRating rating={site.rating} />
                      
                      <p className={`mt-3 mb-4 ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>
                        {site.description}
                      </p>
                      
                      <div className="flex flex-col sm:flex-row gap-3 mt-4">
                        <a
                          href={site.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="btn btn-primary w-full sm:w-auto flex items-center justify-center"
                          aria-label={`Visit ${site.name}`}
                        >
                          Visit <i className="fas fa-external-link-alt ml-2"></i>
                        </a>
                        
                        <button
                          className="btn btn-outline w-full sm:w-auto"
                          onClick={() => toggleFavorite(site.name)}
                          aria-label={`Toggle favorite for ${site.name}`}
                        >
                          {favorites.includes(site.name) ? 'Favorited' : 'Favorite'}
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {filteredSites.length === 0 && (
              <div className="text-center py-16">
                <i className="fas fa-search text-6xl text-gray-400 mb-4"></i>
                <h3 className="text-2xl font-semibold mb-2">No matching platforms found</h3>
                <p className="text-gray-500 dark:text-gray-400">
                  Try adjusting your search or filter criteria.
                </p>
              </div>
            )}
          </div>
        </section>
      );

      const About = () => (
        <section id="about" ref={aboutRef} className="py-20 px-4">
          <div className="max-w-5xl mx-auto text-center">
            <h2 className="text-4xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-purple-500">
              About Anime Hub
            </h2>
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
              <div>
                <p className="text-lg mb-6 leading-relaxed">
                  Anime Hub is your vibrant gateway to free anime streaming. We've curated the best platforms to ensure you can enjoy your favorite anime series without hassle.
                </p>
                <p className="text-lg mb-6 leading-relaxed">
                  Our mission is to provide accurate, up-to-date information about anime streaming services so you can make informed choices about where to watch your favorite shows.
                </p>
                <p className="text-lg mb-6 leading-relaxed">
                  We believe everyone should have access to quality anime content, which is why we focus on both free and legal platforms that respect creators' rights.
                </p>
                <p className="text-md text-gray-500 dark:text-gray-400 italic">
                  Disclaimer: Some listed sites may not be legal in all regions. We recommend using legal platforms like Crunchyroll and RetroCrush to support the anime industry.
                </p>
              </div>
              
              <div className="bg-gradient-to-br from-red-500 to-purple-500 rounded-2xl p-8 text-white shadow-2xl">
                <h3 className="text-2xl font-bold mb-4">Our Features</h3>
                <ul className="space-y-3 text-left">
                  <li className="flex items-center gap-3">
                    <i className="fas fa-check-circle text-green-400"></i>
                    <span>Curated list of trusted platforms</span>
                  </li>
                  <li className="flex items-center gap-3">
                    <i className="fas fa-check-circle text-green-400"></i>
                    <span>Filter by subbed/dubbed content</span>
                  </li>
                  <li className="flex items-center gap-3">
                    <i className="fas fa-check-circle text-green-400"></i>
                    <span>Rating system for quality assessment</span>
                  </li>
                  <li className="flex items-center gap-3">
                    <i className="fas fa-check-circle text-green-400"></i>
                    <span>Favorite saving across devices</span>
                  </li>
                  <li className="flex items-center gap-3">
                    <i className="fas fa-check-circle text-green-400"></i>
                    <span>Dark/light mode for comfortable viewing</span>
                  </li>
                  <li className="flex items-center gap-3">
                    <i className="fas fa-check-circle text-green-400"></i>
                    <span>New: Table view and sorting options</span>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </section>
      );

      const Footer = () => (
        <footer className={`py-10 px-4 text-center ${darkMode ? 'bg-gradient-to-r from-gray-800 to-purple-900' : 'bg-gradient-to-r from-red-100 to-purple-100'}`}>
          <div className="max-w-6xl mx-auto">
            <div className="flex flex-col md:flex-row justify-between items-center gap-6 mb-8">
              <div className="flex items-center gap-2">
                <i className="fas fa-robot text-yellow-300 text-2xl"></i>
                <h3 className="text-2xl font-bold">Anime Hub</h3>
              </div>
              
              <div className="flex gap-6 text-sm text-gray-500 dark:text-gray-400">
                <a href="#home" className="hover:text-purple-500 transition-colors">Home</a>
                <a href="#streaming" className="hover:text-purple-500 transition-colors">Streaming Sites</a>
                <a href="#about" className="hover:text-purple-500 transition-colors">About</a>
                <a href="https://github.com/yourusername/animehub" className="hover:text-purple-500 transition-colors">GitHub</a>
              </div>

              <div className="flex gap-4">
                <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" className="text-gray-500 hover:text-purple-500">
                  <i className="fab fa-twitter text-2xl"></i>
                </a>
                <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" className="text-gray-500 hover:text-purple-500">
                  <i className="fab fa-facebook text-2xl"></i>
                </a>
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" className="text-gray-500 hover:text-purple-500">
                  <i className="fab fa-instagram text-2xl"></i>
                </a>
              </div>
            </div>
            
            <div className="mt-8 pt-8 border-t border-gray-200 dark:border-gray-700">
              <p className="text-sm text-gray-500 dark:text-gray-400">
                &copy; {new Date().getFullYear()} Anime Hub. All rights reserved. 
                <span className="ml-2 text-xs">Last updated: October 02, 2025</span>
              </p>
              <p className="text-xs text-gray-400 mt-2">
                This site is for informational purposes only. We do not host any content ourselves. Always check local laws regarding streaming.
              </p>
            </div>
          </div>
        </footer>
      );

      const ScrollToTopButton = () => (
        <button
          className={`fixed bottom-6 right-6 bg-gradient-to-r from-red-500 to-purple-500 text-white w-14 h-14 rounded-full flex items-center justify-center transition-all duration-300 transform hover:scale-110 shadow-lg ${
            showScroll ? 'opacity-100 visible' : 'opacity-0 invisible'
          }`}
          onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
          aria-label="Scroll to top"
        >
          <i className="fas fa-arrow-up"></i>
        </button>
      );

      return (
        <div className="min-h-screen flex flex-col transition-colors duration-300">
          <Header />
          <Hero />
          <main className="flex-grow">
            <StreamingSites />
            <About />
          </main>
          <Footer />
          <ScrollToTopButton />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
